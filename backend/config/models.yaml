# Claude Gateway model routing.
#
# Opus is intentionally not used anywhere in this table — every tier below
# resolves to sonnet or haiku only. `reasoning`/`opus` keep their names for
# the callers that reference them (see below), they just no longer point at
# an Opus model; repointing the tier is how a model class gets swapped out
# without touching every call site that named the tier.
#
# `fast`/`sonnet` and `reasoning`/`opus` are the same tier under two names:
# services/llm_rbac/engine.py resolves a role to `haiku`/`sonnet`/`opus` (per
# backend/config/llm_rbac.yaml's per-role tiers_allowed — the role-based
# model-access policy), and model_router.resolve() accepts either name for
# the same config entry (see gateway/model_router.py). Callers that predate
# LLM RBAC (generation_judge.py, memory/store.py) keep using `fast`/
# `reasoning` directly, unaffected by this rename-that-isn't-a-rename.
# `haiku` has no such fast/reasoning-style alias — it's role-driven only.
tiers:
  fast:
    # Internal utility calls (router classification, memory summarization,
    # query rewrite, generation judge) — small prompts, small outputs, always
    # on the hot path of a request. Haiku fits what "fast" actually means
    # here; it was pointed at Opus before, which made a handful of tiny
    # internal calls the slowest thing on every turn.
    model: claude-haiku-4-5-20251001
    max_tokens: 4096
    effort: medium
    supports_extended_reasoning: false
  haiku:
    # Cheapest/fastest role-driven tier — the only tier an Employee-role
    # request can ever resolve to (backend/config/llm_rbac.yaml
    # roles.user.model.tiers_allowed) since the role-model-access policy.
    model: claude-haiku-4-5-20251001
    max_tokens: 4096
    effort: medium
    # Verified live: this model rejects BOTH thinking={"type": "adaptive"}
    # and output_config={"effort": ...} with their own 400 invalid_request_error
    # ("adaptive thinking is not supported on this model" / "This model does
    # not support the effort parameter") — sonnet/opus accept both fine.
    # Without this flag, every Employee-role chat turn (the only role gated
    # to this tier) fails and silently degrades to the raw-search fallback
    # with a misleading "no AI model configured" message — see
    # gateway/claude_gateway.py.
    supports_extended_reasoning: false
  sonnet:
    # Mid tier — HR's ceiling, Project Manager's floor
    # (backend/config/llm_rbac.yaml's per-role tiers_allowed).
    model: claude-sonnet-5
    max_tokens: 4096
    effort: medium
  reasoning:
    # Complex planning / multi-step reasoning. This is now the SAME model as
    # `sonnet` — Sonnet is the ceiling tier in this deployment; there is no
    # Opus tier to escalate to above it.
    model: claude-sonnet-5
    max_tokens: 4096
    effort: high
  opus:
    # HR/PM action-based escalation and CEO/Admin dynamic routing
    # (backend/config/llm_rbac.yaml) still name this tier — the role policy
    # is about relative capability, not a specific model family — but it now
    # resolves to Sonnet rather than an actual Opus model. Same value as
    # `reasoning`, kept as a separate config key for the reason in this
    # file's header.
    model: claude-sonnet-5
    max_tokens: 4096
    effort: high

default_tier: fast

# Approximate list pricing per model, used only for the cost_usd estimate
# usage_tracker.py attaches to each logged call — not billing-accurate,
# just enough for relative cost tracking in the admin dashboard. Update
# these to match your actual Anthropic pricing agreement.
pricing:
  claude-opus-5:
    input_per_million_usd: 15.0
    output_per_million_usd: 75.0
  claude-sonnet-5:
    input_per_million_usd: 3.0
    output_per_million_usd: 15.0
  claude-haiku-4-5-20251001:
    input_per_million_usd: 0.80
    output_per_million_usd: 4.0

