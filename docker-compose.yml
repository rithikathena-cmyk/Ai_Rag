services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragchat-net

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT}:8000"
    env_file:
      - .env
    environment:
      # Qdrant runs natively on the host (see start-qdrant.ps1), not in a
      # container, so reach it via Docker Desktop's host gateway rather than
      # a compose service name.
      QDRANT_HOST: host.docker.internal
      POSTGRES_HOST: postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      - document_storage:/app/document_storage
      - report_storage:/app/report_storage
      - docling_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragchat-net

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT}:8501"
    env_file:
      - .env
    environment:
      # .env holds native-run (localhost) defaults; override to the
      # docker-compose service name so container-to-container calls work.
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend/app:/app/app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragchat-net

networks:
  ragchat-net:
    driver: bridge

volumes:
  postgres_data:
  document_storage:
  report_storage:
  docling_cache:
