<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATHENA AI</title>
    <script>
      // Stamp the persisted theme choice before first paint, so there's no
      // flash of the wrong theme while the React bundle loads — mirrors
      // src/hooks/useTheme.ts's own storage key/logic exactly.
      (function () {
        try {
          var stored = localStorage.getItem('athena-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
